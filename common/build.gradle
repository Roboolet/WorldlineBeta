plugins {
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

base {
    archivesName = "${mod_name}-common-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"

    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    // Keep this if common code uses Forge Config API Port.
    compileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_version}"
}

sourceSets.main.resources.srcDir 'src/generated/resources'
